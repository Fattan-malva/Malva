[package]
name = "malva-core"
version = "0.1.0"
edition = "2021"
description = "Malva core: pure policy and event contract (port of malva/shell/policy.py and EVENT_TYPES)"
license = "UNLICENSED"

# Sengaja tanpa dependensi eksternal di tahap PoC: biner kecil dan build cepat di Windows.

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
